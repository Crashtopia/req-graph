<script type="text/javascript">
    RED.nodes.registerType("Text Input", {
        category: "Input",
        color: "#F0A30A",
        defaults: {
            name: { value: "" },
            text: { value: "" },
            propagate: {value: false},
        },
        inputs: 0,
        outputs: 1,
        icon: "font-awesome/fa-pencil",
        label: function () { return this.name || "Text Input"; }
    });
</script>
<script type="text/html" data-template-name="Text Input">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name">
    </div>
    <div class="form-row">
        <label for="node-input-text"><i class="fa fa-pencil"></i> Text</label>
        <textarea id="node-input-text" rows="6" style="width:70%;"></textarea>
    </div>
    <div class="form-row">
        <label><i class="fa fa-upload"></i> Upload</label>
        <input type="file" id="node-input-file" accept=".txt,.md" style="width:70%;">
    </div>
    <div class="form-row">
        <label for="node-propagate-text"><i class="fa fa-check-square-o"></i> Propagate Input</label>
    <input type="checkbox" id="node-input-propagate" style="width:auto;">
    </div>
</script>
<script type="text/html" data-help-name="Text Input">
    <p>Injects a text string into the flow as msg.payload.</p>
</script>

<script type="text/javascript">
    (function () {
        var fileInput = document.getElementById("node-input-file");
        if (fileInput) return;

        document.addEventListener("change", function (e) {
            if (e.target && e.target.id === "node-input-file") {
                var file = e.target.files[0];
                if (!file) return;
                var reader = new FileReader();
                reader.onload = function (evt) {
                    $("#node-input-text").val(evt.target.result);
                };
                reader.readAsText(file);
            }
        });
    })();
</script>
