<script type="text/javascript">
    RED.nodes.registerType("Product Owner", {
        category: "Role Agents",
        color: "#10C8EB",
        defaults: {
            name: { value: "Product Owner" },
            seedingPrompt: {
                value:
                    "You are a Product Owner in a software engineering multi-agent workflow. " +
                    "Be concise. Keep your response under 300 words. Preserve all key information but eliminate redundancy and filler text. " +
                    "Build on inputs from previous agents and stakeholders while applying your product perspective. " +
                    "Preserve valuable information, resolve ambiguities, identify gaps, and improve requirements. " +
                    "Focus on business value, user value, priorities, risks, dependencies, constraints, and success metrics. " +
                    "Translate needs into epics, features, user stories, acceptance criteria, and prioritized requirements. " +
                    "Document trade-offs and resolve stakeholder conflicts when possible. " +
                    "Focus on what should be built and why, not implementation details. " +
                    "Be concise. Keep your response under 500 words. Preserve all key information but eliminate redundancy and filler text.\n" +
                    "Ensure outputs are clear, testable, consistent, traceable, and actionable for downstream software engineering stakeholders."
            },
            model: {
                value: (RED.sidebar.models.getKey("gemini") ? "gemini-2.5-flash" :
                    RED.sidebar.models.getKey("mistral") ? "mistral-large-latest" : "")
            },
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-user",
        label: function () { return this.name || "Product Owner"; },
        oneditsave: function () {
            this.model = $("#node-input-model").val() || this.model;
        }
    });
</script>
<script type="text/html" data-template-name="Product Owner">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name">
    </div>
    <div class="form-row">
        <label for="node-input-seedingPrompt"><i class="fa fa-comment"></i> Seeding <br> Prompt</label>
        <textarea id="node-input-seedingPrompt" rows="4" style="width:70%;"></textarea>
    </div>
    <div class="form-row">
        <label><i class="fa fa-upload"></i> Upload</label>
        <input type="file" id="node-input-prompt-file" accept=".txt,.md" style="width:70%;">
    </div>
    <div class="form-row">
        <label for="node-input-model"><i class="fa fa-cube"></i> Model</label>
        <select id="node-input-model" style="width:70%;"></select>
    </div>
</script>
<script type="text/html" data-help-name="Product Owner">
    <p>A node representing a Product Owner agent.</p>
</script>
<script type="text/javascript">
    (function () {
        var fileInput = document.getElementById("node-input-prompt-file");
        if (fileInput) return;
        document.addEventListener("change", function (e) {
            if (e.target && e.target.id === "node-input-prompt-file") {
                var file = e.target.files[0];
                if (!file) return;
                var reader = new FileReader();
                reader.onload = function (evt) {
                    $("#node-input-seedingPrompt").val(evt.target.result);
                };
                reader.readAsText(file);
            }
        });
    })();
</script>
