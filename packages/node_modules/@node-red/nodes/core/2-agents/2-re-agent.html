<script type="text/javascript">
    RED.nodes.registerType("Requirements Engineer", {
        category: "Role Agents",
        color: "#10C8EB",
        defaults: {
            name: { value: "Requirements Enigneer" },
            seedingPrompt: {
                value:
                    "You are a Requirements Engineering Agent in a software engineering multi-agent workflow. " +
                    "Be concise. Keep your response under 300 words. Preserve all key information but eliminate redundancy and filler text. " +
                    "Build on inputs from previous agents and stakeholders while refining requirements into precise, unambiguous, and verifiable specifications. " +
                    "Preserve all valid product intent while removing ambiguity, inconsistencies, and implicit assumptions. " +
                    "Elicit missing details and explicitly document unknowns instead of guessing. " +
                    "Translate product-level input into structured functional and non-functional requirements with clear scope boundaries. " +
                    "Ensure each requirement is testable, atomic where possible, and traceable to a user or business need. " +
                    "Identify conflicts, overlaps, and gaps across requirements and resolve or escalate them as open issues. " +
                    "Define constraints, edge cases, acceptance criteria, and system-level expectations relevant for engineering design. " +
                    "Focus on correctness, completeness, consistency, and verifiability of requirements, not solution design. " +
                    "Output a structured specification suitable for architecture and implementation planning, including requirements, assumptions, constraints, risks, dependencies, and open questions."
            },
            model: {
                value: (RED.sidebar.models.getKey("gemini") ? "gemini-2.5-flash" :
                    RED.sidebar.models.getKey("mistral") ? "mistral-large-latest" : "")
            },
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-user",
        label: function () { return this.name || "Requirements Engineer"; },
        oneditsave: function () {
            this.model = $("#node-input-model").val();
        }
    });
</script>

<script type="text/html" data-template-name="Requirements Engineer">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name">
    </div>
    <div class="form-row">
    <label for="node-input-seedingPrompt"><i class="fa fa-comment"></i> Seeding <br> Prompt</label>
    <textarea id="node-input-seedingPrompt" rows="4" style="width:70%;"></textarea>
    </div>

    <div class="form-row">
        <label><i class="fa fa-upload"></i> Upload</label>
        <input type="file" id="node-input-prompt-file" accept=".txt,.md" style="width:70%;">
    </div>

    <div class="form-row">
    <label for="node-input-model"><i class="fa fa-cube"></i> Model</label>
    <select id="node-input-model" style="width:70%;"></select>
    </div>
</script>

<script type="text/html" data-help-name="Requirements Engineer">
    <p>A node representing a Requirements Engineer agent.</p>
</script>

<script type="text/javascript">
    (function () {
        var fileInput = document.getElementById("node-input-prompt-file");
        if (fileInput) return;
        document.addEventListener("change", function (e) {
            if (e.target && e.target.id === "node-input-prompt-file") {
                var file = e.target.files[0];
                if (!file) return;
                var reader = new FileReader();
                reader.onload = function (evt) {
                    $("#node-input-seedingPrompt").val(evt.target.result);
                };
                reader.readAsText(file);
            }
        });
    })();
</script>
