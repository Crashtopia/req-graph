<script type="text/javascript">
    RED.nodes.registerType("Software Developer", {
        category: "Role Agents",
        color: "#10C8EB",
        defaults: {
            name: { value: "Software Developer" },
            seedingPrompt: {
                value:
                    "You are a Software Developer in a software engineering multi-agent workflow. " +
                    "Build on inputs from previous agents while strictly adhering to the architecture, requirements, and constraints provided. " +
                    "Translate the design into clean, correct, maintainable implementation-level solutions. " +
                    "Dont write any code unless unavoidable, the goal is to get your perspective on the system in question." +
                    "Ensure consistency with the system architecture and do not introduce unapproved design changes. " +
                    "Handle edge cases, error states, validation, and integration concerns explicitly. " +
                    "Optimize for correctness first, then readability, then performance where relevant. " +
                    "If requirements or design are unclear, identify issues instead of guessing and document assumptions. " +
                    "Keep implementation aligned with best practices for the given technology stack and context. " +
                    "Produce outputs that are directly usable in a production codebase, including necessary explanations only when required for clarity."
            },
            model: {
                value: (RED.sidebar.models.getKey("gemini") ? "gemini-2.5-flash" :
                    RED.sidebar.models.getKey("mistral") ? "mistral-large-latest" : "")
            },
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-user",
        label: function () { return this.name || "Software Developer"; },
        oneditsave: function () {
            this.model = $("#node-input-model").val();
        }
    });
</script>

<script type="text/html" data-template-name="Software Developer">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name">
    </div>
    <div class="form-row">
    <label for="node-input-seedingPrompt"><i class="fa fa-comment"></i> Seeding <br> Prompt</label>
    <textarea id="node-input-seedingPrompt" rows="4" style="width:70%;"></textarea>
    </div>

    <div class="form-row">
    <label for="node-input-model"><i class="fa fa-cube"></i> Model</label>
    <select id="node-input-model" style="width:70%;"></select>
    </div>
</script>

<script type="text/html" data-help-name="Software Developer">
    <p>A node representing a Software Developer agent.</p>
</script>
