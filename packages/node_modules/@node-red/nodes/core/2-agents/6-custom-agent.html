<script type="text/javascript">
    RED.nodes.registerType("Custom", {
        category: "Role Agents",
        color: "#10C8EB",
        defaults: {
            name: { value: "Custom Agent" },
            seedingPrompt: { value: "" },
            model: {
                value: (RED.sidebar.models.getKey("gemini") ? "gemini-2.5-flash" :
                    RED.sidebar.models.getKey("mistral") ? "mistral-large-latest" : "")
            }
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-user",
        label: function () { return this.name || "Custom"; },
        oneditsave: function () {
            this.model = $("#node-input-model").val();
        }
    });

    
</script>

<script type="text/html" data-template-name="Custom">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name">
    </div>
    <div class="form-row">
        <label for="node-input-seedingPrompt"><i class="fa fa-comment"></i> Seeding Prompt</label>
        <textarea id="node-input-seedingPrompt" rows="4" style="width:70%;"></textarea>
    </div>
    <div class="form-row" id="model-row">
        <label for="node-input-model"><i class="fa fa-cube"></i> Model</label>
        <select id="node-input-model" style="width:70%;"></select>
    </div>
</script>
