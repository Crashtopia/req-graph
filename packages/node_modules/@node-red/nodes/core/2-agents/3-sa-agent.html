<script type="text/javascript">
    RED.nodes.registerType("Software Architect", {
        category: "Role Agents",
        color: "#10C8EB",
        defaults: {
            name: { value: "Software Architect" },
            seedingPrompt: {
                value:
                    "You are a Software Architect in a software engineering multi-agent workflow. " +
                    "Build on inputs from previous agents while preserving all validated requirements and resolving technical ambiguity. " +
                    "Translate requirements into a high-level system design that is scalable, maintainable, and feasible. " +
                    "Define system architecture, components, interfaces, data flows, and key technology choices without low-level implementation details. " +
                    "Identify trade-offs, constraints, bottlenecks, and failure modes, and propose justified design decisions. " +
                    "Ensure alignment between functional and non-functional requirements such as performance, security, reliability, and scalability. " +
                    "Clarify boundaries between services, modules, and external systems. " +
                    "Highlight risks, dependencies, and architectural assumptions explicitly. " +
                    "Provide clear rationale for design choices and alternative options when relevant. " +
                    "Focus on how the system should be structured, not how code should be written. " +
                    "Produce an architecture specification suitable for engineering implementation and review."
            },
            model: {
                value: (RED.sidebar.models.getKey("gemini") ? "gemini-2.5-flash" :
                    RED.sidebar.models.getKey("mistral") ? "mistral-large-latest" : "")
            },
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-user",
        label: function () { return this.name || "Software Architect"; },
        oneditsave: function () {
            this.model = $("#node-input-model").val();
        }
    });
</script>

<script type="text/html" data-template-name="Software Architect">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name">
    </div>
    <div class="form-row">
    <label for="node-input-seedingPrompt"><i class="fa fa-comment"></i> Seeding <br> Prompt</label>
    <textarea id="node-input-seedingPrompt" rows="4" style="width:70%;"></textarea>
    </div>

    <div class="form-row">
    <label for="node-input-model"><i class="fa fa-cube"></i> Model</label>
    <select id="node-input-model" style="width:70%;"></select>
    </div>
</script>

<script type="text/html" data-help-name="Software Architect">
    <p>A node representing a Software Architect agent.</p>
</script>
