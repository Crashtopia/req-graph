<script type="text/javascript">
    RED.nodes.registerType("Judge", {
        category: "Role Agents",
        color: "#1091eb",
        defaults: {
            name: { value: "Judge" },
            seedingPrompt: {
                value:
                    "You are a quality gate and review agent.\n" +
                    "Your responsibility is to determine whether the provided input is ready for the next stage of a software engineering workflow.\n" +
                    "\n" +
                    "STRICT OUTPUT RULES:\n" +
                    "- Output ONLY one line.\n" +
                    "- Do NOT output markdown.\n" +
                    "- Do NOT explain your reasoning.\n" +
                    "- Do NOT add notes before or after the result.\n" +
                    "- Do NOT apologize.\n" +
                    "- Do NOT provide summaries.\n" +
                    "- Do NOT rewrite the input.\n" +
                    "- Do NOT suggest implementation details.\n" +
                    "- Output either:\n" +
                    "  CONTINUE\n" +
                    "  OR\n" +
                    "  REVISE - <feedback>\n" +
                    "\n" +
                    "REVIEW CRITERIA:\n" +
                    "- Requirements are complete enough for the current stage.\n" +
                    "- No major ambiguities remain.\n" +
                    "- No conflicting statements exist.\n" +
                    "- Terminology is consistent.\n" +
                    "- Goals and scope are clearly defined.\n" +
                    "- Assumptions are explicit where necessary.\n" +
                    "- Acceptance criteria are testable when applicable.\n" +
                    "- Information is internally consistent.\n" +
                    "- Outputs are actionable for downstream stakeholders.\n" +
                    "- No critical gaps, risks, or dependencies are omitted.\n" +
                    "Be concise. Keep your response under 300 words. Preserve all key information but eliminate redundancy and filler text. \n" +
                    "\n" +
                    "DECISION RULES:\n" +
                    "- Output ✓ Accepted only if no material issues remain.\n" +
                    "- Output REVISE if any ambiguity, conflict, inconsistency, missing information, scope issue, traceability issue, or quality concern could negatively affect downstream work.\n" +
                    "- In REVISE mode, provide concise, actionable feedback separated by semicolons.\n" +
                    "- Focus only on issues that materially affect quality.\n" +
                    "- Be strict and conservative when approving.\n" +
                    "- If uncertain, choose REVISE."
            },
            model: {
                value: (RED.sidebar.models.getKey("gemini") ? "gemini-2.5-flash" :
                    RED.sidebar.models.getKey("mistral") ? "mistral-large-latest" : "")
            },
        },
        inputs: 1,
        outputs: 2,
        outputLabels: ["Approved", "Rejected"],
        icon: "font-awesome/fa-balance-scale",
        label: function () { return this.name || "Judge"; },
        oneditsave: function () {
            this.model = $("#node-input-model").val();
        }

    });
</script>

<script type="text/html" data-template-name="Judge">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name">
    </div>
   <div class="form-row">
    <label for="node-input-seedingPrompt"><i class="fa fa-comment"></i> Seeding <br> Prompt</label>
    <textarea id="node-input-seedingPrompt" rows="4" style="width:70%;"></textarea>
    </div>

    <div class="form-row">
        <label><i class="fa fa-upload"></i> Upload</label>
        <input type="file" id="node-input-prompt-file" accept=".txt,.md" style="width:70%;">
    </div>
    
    <div class="form-row">
    <label for="node-input-model"><i class="fa fa-cube"></i> Model</label>
    <select id="node-input-model" style="width:70%;"></select>
    </div>
</script>

<script type="text/html" data-help-name="Judge">
    <p>A Judge agent neccessary for determining if a output is satisfactory to continue.
        Either this or a HITL component need to be at the end of a loop.
    </p>
</script>

<script type="text/javascript">
    (function () {
        var fileInput = document.getElementById("node-input-prompt-file");
        if (fileInput) return;
        document.addEventListener("change", function (e) {
            if (e.target && e.target.id === "node-input-prompt-file") {
                var file = e.target.files[0];
                if (!file) return;
                var reader = new FileReader();
                reader.onload = function (evt) {
                    $("#node-input-seedingPrompt").val(evt.target.result);
                };
                reader.readAsText(file);
            }
        });
    })();
</script>
