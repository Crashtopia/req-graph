<script type="text/javascript">
    RED.nodes.registerType("Tester", {
        category: "Role Agents",
        color: "#10C8EB",
        defaults: {
            name: { value: "Software Tester" },
            seedingPrompt: {
                value:
                    "You are a Software Tester in a software engineering multi-agent workflow. " +
                    "Be concise. Keep your response under 300 words. Preserve all key information but eliminate redundancy and filler text. " +
                    "Build on inputs from previous agents while validating the system against requirements, design, and implementation. " +
                    "Identify defects, inconsistencies, missing coverage, and edge cases across functional and non-functional aspects. " +
                    "Design clear, reproducible test cases including expected results and failure conditions. " +
                    "Focus on correctness, reliability, security, performance, and usability from a user and system perspective. " +
                    "Verify traceability from requirements to tests and highlight any gaps in coverage. " +
                    "Do not assume behavior; rely on specified requirements and observed outputs. " +
                    "Report issues with precise steps to reproduce and severity classification. " +
                    "Suggest improvements to increase robustness and testability when relevant, without redesigning the system. " +
                    "Produce structured test artifacts including test cases, defect reports, coverage analysis, and risk assessment. \n"
            },
            model: {
                value: (RED.sidebar.models.getKey("gemini") ? "gemini-2.5-flash" :
                    RED.sidebar.models.getKey("mistral") ? "mistral-large-latest" : "")
            },
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-user",
        label: function () { return this.name || "Tester"; },
        oneditsave: function () {
            this.model = $("#node-input-model").val();
        }

    });
</script>

<script type="text/html" data-template-name="Tester">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name">
    </div>
    <div class="form-row">
    <label for="node-input-seedingPrompt"><i class="fa fa-comment"></i> Seeding <br> Prompt</label>
    <textarea id="node-input-seedingPrompt" rows="4" style="width:70%;"></textarea>
    </div>

    <div class="form-row">
        <label><i class="fa fa-upload"></i> Upload</label>
        <input type="file" id="node-input-prompt-file" accept=".txt,.md" style="width:70%;">
    </div> 

    <div class="form-row">
    <label for="node-input-model"><i class="fa fa-cube"></i> Model</label>
    <select id="node-input-model" style="width:70%;"></select>
    </div>
</script>

<script type="text/html" data-help-name="Tester">
    <p>A node representing a Tester.</p>
</script>

<script type="text/javascript">
    (function () {
        var fileInput = document.getElementById("node-input-prompt-file");
        if (fileInput) return;
        document.addEventListener("change", function (e) {
            if (e.target && e.target.id === "node-input-prompt-file") {
                var file = e.target.files[0];
                if (!file) return;
                var reader = new FileReader();
                reader.onload = function (evt) {
                    $("#node-input-seedingPrompt").val(evt.target.result);
                };
                reader.readAsText(file);
            }
        });
    })();
</script>
