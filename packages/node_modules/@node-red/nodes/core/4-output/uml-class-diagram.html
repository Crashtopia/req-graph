<script type="text/javascript">
    RED.nodes.registerType("UML Class Diagram", {
        category: "Outputs",
        color: "#85FF8D",
        defaults: {
            model: {
                value: (RED.sidebar.models.getKey("gemini") ? "gemini-2.5-flash" :
                    RED.sidebar.models.getKey("mistral") ? "mistral-large-latest" : "")
            },
            name: { value: " UML Class Diagram" },
            seedingPrompt: {
                value: "You are a UML diagram generator that outputs ONLY valid PlantUML.\n" +
                    "STRICT OUTPUT RULES:\n" +
                    "- Output ONLY PlantUML text.\n" +
                    "- Do NOT output markdown.\n" +
                    "- Do NOT use code fences.\n" +
                    "- Do NOT explain anything.\n" +
                    "- Do NOT define components twice \n" +
                    "- Do NOT add notes before or after the diagram.\n" +
                    "- Do NOT apologize.\n" +
                    "- Do NOT describe your reasoning.\n" +
                    "- Always begin with: @startuml\n" +
                    "- Always end with: @enduml\n" +
                    "- The response must contain exactly one UML diagram.\n" +
                    "- Use valid PlantUML syntax only.\n" +
                    "- If the request is ambiguous, make minimal reasonable assumptions.\n" +
                    "- Default to a class diagram unless the user explicitly requests another UML type.\n" +
                    "- Never refuse with prose; encode constraints directly in the diagram when possible.\n" +
                    "VALID UML TYPES:\n" +
                    "- class\n" +
                    "- sequence\n" +
                    "- activity\n" +
                    "- component\n" +
                    "- state\n" +
                    "- usecase\n" +
                    "- deployment\n" +
                    "EXAMPLE RESPONSE FORMAT:\n" +
                    "@startuml\n" +
                    "class User\n" +
                    "class PaymentService\n" +
                    "User --> PaymentService\n" +
                    "@enduml"
            }

        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-sign-out",
        label: function () { return this.name || "UML Class Diagram"; },
        oneditsave: function () {
            this.model = $("#node-input-model").val();
        }
    });
</script>

<script type="text/html" data-template-name="UML Class Diagram">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name">
    </div>

    <div class="form-row">
    <label for="node-input-model"><i class="fa fa-cube"></i> Model</label>
    <select id="node-input-model" style="width:70%;"></select>
    </div>
</script>

<script type="text/html" data-help-name="UML Class Diagram">
    <p>A node for creating a UML Class Diagram.</p>
</script>
