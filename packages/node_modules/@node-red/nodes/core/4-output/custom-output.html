<script type="text/javascript">
    RED.nodes.registerType("Custom Output", {
        category: "Outputs",
        color: "#85FF8D",
        defaults: {
            name: { value: "" },
            seedingPrompt: {
                value: "Create an awesome output"
            },
            model: {
                value: (RED.sidebar.models.getKey("gemini") ? "gemini-2.5-flash" :
                    RED.sidebar.models.getKey("mistral") ? "mistral-large-latest" : "")
            },
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-sign-out",
        label: function () { return this.name || "Custom Output"; },
        oneditsave: function () {
            this.model = $("#node-input-model").val();
        }
    });
</script>

<script type="text/html" data-template-name="Custom Output">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name">
    </div>
    <div class="form-row">
        <label for="node-input-seedingPrompt"><i class="fa fa-comment"></i> Seeding <br> Prompt</label>
        <textarea id="node-input-seedingPrompt" rows="4" style="width:70%;"></textarea>
    </div>
    
    <div class="form-row">
    <label for="node-input-model"><i class="fa fa-cube"></i> Model</label>
    <select id="node-input-model" style="width:70%;"></select>
    </div>
</script>

<script type="text/html" data-help-name="Custom Output">
    <p>A node for creating custom outputs.</p>
</script>
