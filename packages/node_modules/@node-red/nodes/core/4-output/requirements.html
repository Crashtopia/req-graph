<script type="text/javascript">
    RED.nodes.registerType("Requirements", {
        category: "Outputs",
        color: "#85FF8D",
        defaults: {
            name: { value: "Requirements" },
            model: {
                value: (RED.sidebar.models.getKey("gemini") ? "gemini-2.5-flash" :
                    RED.sidebar.models.getKey("mistral") ? "mistral-large-latest" : "")
            },
            seedingPrompt: {
                value:
                    "You are a software requirements generator.\n" +
                    "STRICT OUTPUT RULES:\n" +
                    "- Output ONLY structured requirements text.\n" +
                    "- Do NOT output markdown.\n" +
                    "- Do NOT use code fences.\n" +
                    "- Do NOT explain anything.\n" +
                    "- Do NOT add notes before or after the requirements.\n" +
                    "- Do NOT apologize.\n" +
                    "- Do NOT describe your reasoning.\n" +
                    "- Always organize requirements into sections.\n" +
                    "- Always include both functional and non-functional requirements.\n" +
                    "- Use concise and precise language.\n" +
                    "- Avoid duplicate requirements.\n" +
                    "- Every requirement must be atomic and testable.\n" +
                    "- If the request is ambiguous, make minimal reasonable assumptions.\n" +
                    "- Default structure:\n" +
                    "  1. Overview\n" +
                    "  2. Functional Requirements\n" +
                    "  3. Non-Functional Requirements\n" +
                    "  4. Constraints\n" +
                    "  5. External Integrations\n" +
                    "- Never refuse with prose; encode constraints directly in the requirements.\n" +
                    "REQUIREMENT RULES:\n" +
                    "- Functional requirements must start with 'FR-'.\n" +
                    "- Non-functional requirements must start with 'NFR-'.\n" +
                    "- Constraints must start with 'CON-'.\n" +
                    "- Integrations must start with 'INT-'.\n" +
                    "- Each requirement must have a unique identifier.\n" +
                    "- Each requirement must describe observable behavior.\n" +
                    "EXAMPLE RESPONSE FORMAT:\n" +
                    "Overview:\n" +
                    "Payment processing platform for online merchants.\n\n" +
                    "Functional Requirements:\n" +
                    "FR-1: The system shall allow users to create accounts.\n" +
                    "FR-2: The system shall process payments using Stripe.\n\n" +
                    "Non-Functional Requirements:\n" +
                    "NFR-1: API responses shall complete within 200ms under normal load.\n" +
                    "NFR-2: The system shall support horizontal scaling.\n\n" +
                    "Constraints:\n" +
                    "CON-1: The platform shall use PostgreSQL as the primary database.\n\n" +
                    "External Integrations:\n" +
                    "INT-1: The system shall integrate with Stripe APIs for payment processing."
            }
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-sign-out",
        label: function () { return this.name || "Requirements"; },
        oneditsave: function () {
            this.model = $("#node-input-model").val();
        }
    });
</script>

<script type="text/html" data-template-name="Requirements">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name">
    </div>

    <div class="form-row">
    <label for="node-input-model"><i class="fa fa-cube"></i> Model</label>
    <select id="node-input-model" style="width:70%;"></select>
    </div>
</script>

<script type="text/html" data-help-name="Requirements">
    <p>A node for creating Requirements.</p>
</script>
