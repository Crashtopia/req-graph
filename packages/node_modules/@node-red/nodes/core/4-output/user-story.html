<script type="text/javascript">
    RED.nodes.registerType("User Story", {
        category: "Outputs",
        color: "#85FF8D",
        defaults: {
            name: { value: "" },
            model: {
                value: (RED.sidebar.models.getKey("gemini") ? "gemini-2.5-flash" :
                    RED.sidebar.models.getKey("mistral") ? "mistral-large-latest" : "")
            },
            seedingPrompt: {
                value:
                    "You are a user story generator.\n" +
                    "STRICT OUTPUT RULES:\n" +
                    "- Output ONLY structured user stories.\n" +
                    "- Do NOT output markdown.\n" +
                    "- Do NOT use code fences.\n" +
                    "- Do NOT explain anything.\n" +
                    "- Do NOT add notes before or after the user stories.\n" +
                    "- Do NOT apologize.\n" +
                    "- Do NOT describe your reasoning.\n" +
                    "- Always organize stories into sections.\n" +
                    "- Use concise and precise language.\n" +
                    "- Avoid duplicate stories.\n" +
                    "- Every story must describe observable user value.\n" +
                    "- If the request is ambiguous, make minimal reasonable assumptions.\n" +
                    "- Default structure:\n" +
                    "  1. Overview\n" +
                    "  2. Epics\n" +
                    "  3. User Stories\n" +
                    "  4. Acceptance Criteria\n" +
                    "- Never refuse with prose; encode constraints directly in the stories.\n" +
                    "USER STORY RULES:\n" +
                    "- Every epic must start with 'EPIC-'.\n" +
                    "- Every user story must start with 'US-'.\n" +
                    "- Every acceptance criterion must start with 'AC-'.\n" +
                    "- Each item must have a unique identifier.\n" +
                    "- Use the format: 'As a <role>, I want <goal>, so that <benefit>'.\n" +
                    "- Acceptance criteria must be testable.\n" +
                    "- Stories must focus on user outcomes, not implementation details.\n" +
                    "EXAMPLE RESPONSE FORMAT:\n" +
                    "Overview:\n" +
                    "Online payment platform for merchants and customers.\n\n" +
                    "Epics:\n" +
                    "EPIC-1: User Account Management\n\n" +
                    "User Stories:\n" +
                    "US-1: As a customer, I want to create an account, so that I can track my payments.\n" +
                    "US-2: As a merchant, I want to receive payment notifications, so that I can confirm successful transactions.\n\n" +
                    "Acceptance Criteria:\n" +
                    "AC-1: Users shall be able to register using email and password.\n" +
                    "AC-2: The system shall send payment confirmation notifications within 5 seconds."
            }
        },
        inputs: 1,
        icon: "font-awesome/fa-sign-out",
        label: function () { return this.name || "User Story"; },
        oneditsave: function () {
            this.model = $("#node-input-model").val();
        }
    });
</script>

<script type="text/html" data-template-name="User Story">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name">
    </div>

    <div class="form-row">
    <label for="node-input-model"><i class="fa fa-cube"></i> Model</label>
    <select id="node-input-model" style="width:70%;"></select>
    </div>
</script>

<script type="text/html" data-help-name="User Story">
    <p>A node for creating User Stories.</p>
</script>
