<script type="text/javascript">
    RED.nodes.registerType("User Story", {
        category: "Outputs",
        color: "#85FF8D",
        defaults: {
            name: { value: "" },
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-sign-out",
        label: function () { return this.name || "User Story"; },
        oneditsave: function () {
            this.model = $("#node-input-model").val();
        }
    });
</script>

<script type="text/html" data-template-name="User Story">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name">
    </div>

    <div class="form-row">
    <label for="node-input-model"><i class="fa fa-cube"></i> Model</label>
    <select id="node-input-model" style="width:70%;"></select>
    </div>
</script>

<script type="text/html" data-help-name="User Story">
    <p>A node for creating User Stories.</p>
</script>
